<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <linearGradient id="map-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120824" />
      <stop offset="100%" stop-color="#090314" />
    </linearGradient>
    <filter id="route-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="street-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3b136f" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- Window Frame -->
  <rect width="540" height="340" rx="10" fill="url(#map-bg)" stroke="#7e22ce" stroke-width="1.5" />
  
  <!-- Window Top Bar -->
  <rect width="540" height="32" rx="10" fill="#24103f" />
  <rect y="22" width="540" height="10" fill="#24103f" />
  <circle cx="20" cy="16" r="5" fill="#ef4444" />
  <circle cx="36" cy="16" r="5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="5" fill="#10b981" />
  <text x="270" y="21" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" class="mono">WAYBOUND Interactive Adventure Map</text>

  <!-- Map Grid Canvas -->
  <rect y="32" width="540" height="308" fill="url(#street-grid)" />

  <!-- Street Paths / Roads -->
  <g stroke="#3b1768" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 40 260 L 160 210 L 290 230 L 410 160 L 510 180" />
    <path d="M 160 210 L 190 100 L 320 80 L 410 160" />
    <path d="M 80 80 L 190 100 L 210 320" />
  </g>

  <!-- Walking Polyline (Live Google Routes Walking Path) -->
  <path d="M 120 225 Q 150 215 160 210 T 210 160 T 290 150 T 360 145" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-dasharray="6,4" filter="url(#route-glow)" />

  <!-- User Blue Marker with Accuracy Circle -->
  <circle cx="120" cy="225" r="24" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5" />
  <circle cx="120" cy="225" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  <circle cx="120" cy="225" r="3.5" fill="#ffffff" />
  <text x="120" y="260" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle" class="sans">You (GPS Live)</text>

  <!-- Unlocked Waypoint Marker 1: Lyon Street Steps -->
  <g transform="translate(290, 150)">
    <circle r="16" fill="#3b0764" stroke="#fbbf24" stroke-width="2.2" />
    <text x="0" y="6" font-size="14" font-weight="900" fill="#fbbf24" text-anchor="middle" class="sans">?</text>
    <rect x="-65" y="-38" width="130" height="22" rx="4" fill="#1e1035" stroke="#fbbf24" stroke-width="1" />
    <text x="0" y="-23" fill="#fef08a" font-size="10" font-weight="bold" text-anchor="middle" class="sans">Hint #1: Hilltop Stairs</text>
  </g>

  <!-- Translucent Mystery Search Zone (Hidden Destination) -->
  <g transform="translate(420, 120)">
    <circle r="52" fill="#9333ea" fill-opacity="0.22" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,4" />
    <circle r="22" fill="#7e22ce" fill-opacity="0.3" stroke="#a855f7" stroke-width="1" />
    <text x="0" y="-8" fill="#e9d5ff" font-size="11" font-weight="900" text-anchor="middle" class="mono">MYSTERY</text>
    <text x="0" y="8" fill="#d8b4fe" font-size="9" font-weight="bold" text-anchor="middle" class="mono">SEARCH ZONE</text>
    <text x="0" y="22" fill="#fbbf24" font-size="8" text-anchor="middle" class="sans">Secret Destination</text>
  </g>

  <!-- Route Floating HUD at Bottom -->
  <g transform="translate(40, 275)">
    <rect width="460" height="48" rx="8" fill="#1b0e36" stroke="#9333ea" stroke-width="1.2" />
    <text x="18" y="21" fill="#fef08a" font-size="13" font-weight="bold" class="sans">🚶 Waypoint Route: 420m (6 min walk)</text>
    <text x="18" y="38" fill="#c084fc" font-size="11" class="sans">Target: Hillside stone stairs overlooking bay</text>
    <rect x="330" y="10" width="115" height="28" rx="6" fill="#7e22ce" stroke="#fbbf24" stroke-width="1" />
    <text x="387" y="28" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" class="sans">Follow Route →</text>
  </g>
</svg>
