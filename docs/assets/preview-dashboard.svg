<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e2f" />
      <stop offset="100%" stop-color="#0e071c" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- Device / Window Frame -->
  <rect width="540" height="340" rx="10" fill="url(#card-bg)" stroke="#7e22ce" stroke-width="1.5" />
  
  <!-- Window Top Bar -->
  <rect width="540" height="32" rx="10" fill="#261245" />
  <rect y="22" width="540" height="10" fill="#261245" />
  <circle cx="20" cy="16" r="5" fill="#ef4444" />
  <circle cx="36" cy="16" r="5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="5" fill="#10b981" />
  <text x="270" y="21" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" class="mono">waybound.app — Explorer Hub</text>

  <!-- Explorer Profile Header Card -->
  <g transform="translate(24, 48)">
    <rect width="492" height="72" rx="8" fill="#1f113b" stroke="#6b21a8" stroke-width="1" />
    <!-- Crest Icon -->
    <circle cx="38" cy="36" r="22" fill="#3b0764" stroke="#fbbf24" stroke-width="2" />
    <text x="38" y="42" font-size="20" text-anchor="middle">🧭</text>
    
    <!-- Title & Archetype -->
    <text x="72" y="30" fill="#fef08a" font-size="16" font-weight="bold" class="sans">Valerius the Pathfinder</text>
    <rect x="72" y="38" width="120" height="18" rx="4" fill="#581c87" />
    <text x="132" y="51" fill="#e9d5ff" font-size="10" font-weight="bold" text-anchor="middle" class="sans">MYSTERY SEEKER</text>
    
    <!-- Level Badge -->
    <rect x="408" y="18" width="68" height="36" rx="6" fill="#3b0764" stroke="#fbbf24" stroke-width="1.5" />
    <text x="442" y="32" fill="#fef08a" font-size="10" font-weight="bold" text-anchor="middle" class="sans">LEVEL</text>
    <text x="442" y="48" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle" class="mono">4</text>
  </g>

  <!-- XP Progression Bar -->
  <g transform="translate(24, 130)">
    <rect width="492" height="34" rx="6" fill="#190c30" stroke="#4c1d95" stroke-width="1" />
    <text x="14" y="21" fill="#c084fc" font-size="11" font-weight="bold" class="sans">Level Progress</text>
    <text x="478" y="21" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="end" class="mono">1,850 / 2,000 XP</text>
    <rect x="110" y="12" width="260" height="10" rx="5" fill="#2e1065" />
    <rect x="110" y="12" width="220" height="10" rx="5" fill="#f59e0b" filter="url(#soft-glow)" />
  </g>

  <!-- Recent Quest Journal Entry -->
  <g transform="translate(24, 174)">
    <rect width="492" height="142" rx="8" fill="#1a0d33" stroke="#6b21a8" stroke-width="1" />
    <rect x="16" y="14" width="76" height="20" rx="4" fill="#047857" />
    <text x="54" y="28" fill="#d1fae5" font-size="10" font-weight="bold" text-anchor="middle" class="sans">COMPLETED</text>
    <text x="100" y="29" fill="#ffffff" font-size="14" font-weight="bold" class="sans">The Whispering Rotunda Columns</text>
    
    <text x="16" y="60" fill="#d8b4fe" font-size="12" class="sans">San Francisco · Palace of Fine Arts Rotunda</text>
    <text x="16" y="80" fill="#9ca3af" font-size="11" class="sans">Uncovered ancient Greco-Roman colonnades flanking the tidal lagoon.</text>
    
    <g transform="translate(16, 96)">
      <rect width="110" height="26" rx="4" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
      <text x="55" y="17" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle" class="sans">🏆 +350 XP Gained</text>
    </g>
    <g transform="translate(136, 96)">
      <rect width="120" height="26" rx="4" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
      <text x="60" y="17" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="middle" class="sans">👣 1.4 km Walked</text>
    </g>
    <g transform="translate(266, 96)">
      <rect width="100" height="26" rx="4" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
      <text x="50" y="17" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle" class="sans">⏱️ 28 Minutes</text>
    </g>
  </g>
</svg>
