<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <linearGradient id="clue-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160c2b" />
      <stop offset="100%" stop-color="#0c0517" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- Frame -->
  <rect width="540" height="340" rx="10" fill="url(#clue-bg)" stroke="#7e22ce" stroke-width="1.5" />
  
  <!-- Window Top Bar -->
  <rect width="540" height="32" rx="10" fill="#24103f" />
  <rect y="22" width="540" height="10" fill="#24103f" />
  <circle cx="20" cy="16" r="5" fill="#ef4444" />
  <circle cx="36" cy="16" r="5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="5" fill="#10b981" />
  <text x="270" y="21" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" class="mono">Field Transmission — Clue Progression</text>

  <!-- Quest Title & Meta -->
  <g transform="translate(24, 48)">
    <text x="0" y="20" fill="#fef08a" font-size="17" font-weight="bold" class="sans">The Greco-Roman Echoes</text>
    <text x="0" y="38" fill="#c084fc" font-size="12" class="sans">Difficulty: Medium · Reward: +300 XP · Status: Active</text>
    <!-- Voice Narration Button -->
    <rect x="360" y="5" width="130" height="28" rx="14" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
    <text x="425" y="23" fill="#e9d5ff" font-size="11" font-weight="bold" text-anchor="middle" class="sans">🔊 Voice Narration</text>
  </g>

  <!-- Clue 1: Unlocked with Waypoint Coordinates -->
  <g transform="translate(24, 98)">
    <rect width="492" height="66" rx="8" fill="#231342" stroke="#fbbf24" stroke-width="1.4" />
    <circle cx="24" cy="24" r="12" fill="#fbbf24" />
    <text x="24" y="28" font-size="11" font-weight="900" fill="#1e1035" text-anchor="middle" class="sans">1</text>
    <text x="46" y="22" fill="#fef08a" font-size="11" font-weight="bold" class="sans">CLUE UNLOCKED · WAYPOINT IDENTIFIED</text>
    <text x="46" y="42" fill="#ffffff" font-size="12" class="sans">"Ascend the manicured hillside stairs overlooking the bay."</text>
    <!-- Waypoint Tag -->
    <rect x="325" y="10" width="150" height="20" rx="4" fill="#4c1d95" />
    <text x="400" y="24" fill="#fef08a" font-size="9" font-weight="bold" text-anchor="middle" class="sans">📍 Lyon Street Steps (37.794, -122.446)</text>
  </g>

  <!-- Clue 2: Unlocked with Waypoint Coordinates -->
  <g transform="translate(24, 172)">
    <rect width="492" height="66" rx="8" fill="#231342" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="24" cy="24" r="12" fill="#c084fc" />
    <text x="24" y="28" font-size="11" font-weight="900" fill="#1e1035" text-anchor="middle" class="sans">2</text>
    <text x="46" y="22" fill="#d8b4fe" font-size="11" font-weight="bold" class="sans">CLUE UNLOCKED · WAYPOINT IDENTIFIED</text>
    <text x="46" y="42" fill="#ffffff" font-size="12" class="sans">"Cross the arched stone bridge flanking the tranquil lagoon."</text>
    <!-- Waypoint Tag -->
    <rect x="325" y="10" width="150" height="20" rx="4" fill="#4c1d95" />
    <text x="400" y="24" fill="#fef08a" font-size="9" font-weight="bold" text-anchor="middle" class="sans">📍 Marina Bridge (37.801, -122.447)</text>
  </g>

  <!-- Clue 3: Locked Final Destination Hint -->
  <g transform="translate(24, 246)">
    <rect width="492" height="66" rx="8" fill="#160a28" stroke="#581c87" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="24" cy="24" r="12" fill="#4c1d95" />
    <text x="24" y="28" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="middle" class="sans">🔒</text>
    <text x="46" y="22" fill="#9ca3af" font-size="11" font-weight="bold" class="sans">FINAL MYSTERY DESTINATION · SEALED</text>
    <text x="46" y="44" fill="#6b7280" font-size="12" class="sans">Unlock upon reaching the waypoint or spending adventure energy...</text>
    <!-- Secrecy Badge -->
    <rect x="350" y="10" width="125" height="20" rx="4" fill="#2e1065" />
    <text x="412" y="24" fill="#a855f7" font-size="9" font-weight="bold" text-anchor="middle" class="mono">DESTINATION SECRET</text>
  </g>
</svg>
