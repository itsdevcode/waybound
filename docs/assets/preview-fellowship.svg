<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <linearGradient id="coop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e30" />
      <stop offset="100%" stop-color="#0a0416" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- Frame -->
  <rect width="540" height="340" rx="10" fill="url(#coop-bg)" stroke="#7e22ce" stroke-width="1.5" />
  
  <!-- Window Top Bar -->
  <rect width="540" height="32" rx="10" fill="#24103f" />
  <rect y="22" width="540" height="10" fill="#24103f" />
  <circle cx="20" cy="16" r="5" fill="#ef4444" />
  <circle cx="36" cy="16" r="5" fill="#f59e0b" />
  <circle cx="52" cy="16" r="5" fill="#10b981" />
  <text x="270" y="21" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" class="mono">Mystery Fellowship — Two-Player Cooperative Quest</text>

  <!-- Fellowship Header Card -->
  <g transform="translate(24, 46)">
    <rect width="492" height="60" rx="8" fill="#231342" stroke="#6b21a8" stroke-width="1" />
    <circle cx="32" cy="30" r="18" fill="#3b0764" stroke="#34d399" stroke-width="2" />
    <text x="32" y="36" font-size="16" text-anchor="middle">⚔️</text>
    <text x="60" y="26" fill="#fef08a" font-size="15" font-weight="bold" class="sans">Fellowship: Order of the Key</text>
    <text x="60" y="44" fill="#a7f3d0" font-size="11" class="sans">Status: Synchronized · Both Explorers in Field</text>
    
    <rect x="360" y="15" width="115" height="28" rx="6" fill="#047857" />
    <text x="417" y="33" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" class="sans">2/2 Players Active</text>
  </g>

  <!-- Player 1 Slot Card -->
  <g transform="translate(24, 118)">
    <rect width="238" height="150" rx="8" fill="#1b0e36" stroke="#9333ea" stroke-width="1.2" />
    <!-- Avatar & Nickname -->
    <circle cx="28" cy="28" r="14" fill="#3b0764" stroke="#fbbf24" stroke-width="1.5" />
    <text x="28" y="33" font-size="13" text-anchor="middle">🧭</text>
    <text x="50" y="26" fill="#fef08a" font-size="13" font-weight="bold" class="sans">Seeker (Host)</text>
    <text x="50" y="40" fill="#a855f7" font-size="10" class="sans">Perspective: Fragment I</text>
    
    <!-- Clue Perspective Box -->
    <rect x="12" y="52" width="214" height="54" rx="6" fill="#2e1065" />
    <text x="20" y="70" fill="#e9d5ff" font-size="10" font-weight="bold" class="sans">Fragment I (Private):</text>
    <text x="20" y="86" fill="#d8b4fe" font-size="10" class="sans">"Look for the stone archway that</text>
    <text x="20" y="98" fill="#d8b4fe" font-size="10" class="sans">guards the water entrance."</text>
    
    <!-- Status -->
    <rect x="12" y="114" width="214" height="24" rx="4" fill="#065f46" />
    <text x="119" y="130" fill="#d1fae5" font-size="10" font-weight="bold" text-anchor="middle" class="sans">✓ Arrival Verified (GPS)</text>
  </g>

  <!-- Player 2 Slot Card -->
  <g transform="translate(278, 118)">
    <rect width="238" height="150" rx="8" fill="#1b0e36" stroke="#065f46" stroke-width="1.2" />
    <!-- Avatar & Nickname -->
    <circle cx="28" cy="28" r="14" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="28" y="33" font-size="13" text-anchor="middle">📜</text>
    <text x="50" y="26" fill="#a7f3d0" font-size="13" font-weight="bold" class="sans">Scholar (Partner)</text>
    <text x="50" y="40" fill="#34d399" font-size="10" class="sans">Perspective: Fragment II</text>
    
    <!-- Clue Perspective Box -->
    <rect x="12" y="52" width="214" height="54" rx="6" fill="#064e3b" />
    <text x="20" y="70" fill="#a7f3d0" font-size="10" font-weight="bold" class="sans">Fragment II (Private):</text>
    <text x="20" y="86" fill="#d1fae5" font-size="10" class="sans">"Observe the iron crest affixed to</text>
    <text x="20" y="98" fill="#d1fae5" font-size="10" class="sans">the western pier pillar."</text>
    
    <!-- Status -->
    <rect x="12" y="114" width="214" height="24" rx="4" fill="#047857" />
    <text x="119" y="130" fill="#d1fae5" font-size="10" font-weight="bold" text-anchor="middle" class="sans">✓ Arrival Verified (GPS)</text>
  </g>

  <!-- Mutual Completion Banner -->
  <g transform="translate(24, 280)">
    <rect width="492" height="46" rx="8" fill="#1e1035" stroke="#fbbf24" stroke-width="1.2" />
    <text x="246" y="22" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle" class="sans">🎉 Mutual Arrival Confirmed! Shared XP Rewarded</text>
    <text x="246" y="38" fill="#c084fc" font-size="10" text-anchor="middle" class="mono">Cooperative Destination Unveiled · +500 Shared Fellowship XP</text>
  </g>
</svg>
