# Render Blueprint configuration for WAYBOUND
# Docs: https://render.com/docs/blueprint-spec
version: "1"

databases:
  - name: waybound-db
    databaseName: waybound
    user: waybound_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: waybound-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/start_backend.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: waybound-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOW_DEMO_AUTH
        value: "false"
      - key: RATE_LIMIT_STORAGE
        value: database
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: TRUSTED_PROXIES
        value: "127.0.0.1,::1,10.0.0.0/8"
      - key: QUEST_PROVIDER
        value: demo
      # Transactional Email Authentication (Resend / SMTP)
      - key: EMAIL_PROVIDER
        value: resend
      # Explicitly configured, verified sending address (e.g. auth@yourdomain.com or onboarding@resend.dev)
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # External AI / Map Services (Server-Side Only)
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      # ElevenLabs Premium Narration (Optional)
      - key: ELEVENLABS_ENABLED
        value: "false"
      - key: ELEVENLABS_API_KEY
        sync: false
      # CORS: Allow cross-origin requests from the public frontend origin (strict HTTPS, no wildcard)
      # Configure your deployed frontend's public HTTPS origin in Render Dashboard (e.g. https://waybound-frontend.onrender.com)
      - key: CORS_ORIGINS
        sync: false

  # 2. Next.js Frontend Web Service
  - type: web
    name: waybound-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      # Public Backend API Target (Baked into client bundle at build-time & used at runtime)
      # Configure your deployed backend's public HTTPS URL in Render Dashboard (e.g. https://waybound-backend.onrender.com)
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Backend API Target for Next.js server-side rewrites proxy
      # Configure your deployed backend's public HTTPS URL in Render Dashboard (e.g. https://waybound-backend.onrender.com)
      - key: BACKEND_URL
        sync: false
